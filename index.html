<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Yolg'izlik Chat — Test</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="app">

    <!-- BOSHLASH -->
    <section id="start-screen" class="screen active">
      <div class="card">
        <div class="logo">
          <div class="logo-icon">💬</div>
          <h1>Yolg'izlik Chat</h1>
          <p class="tagline">Ro‘yxatdan o‘tish yo‘q. Havola yuboring va yozishing.</p>
        </div>

        <div class="input-group">
          <label>Ismingiz (ixtiyoriy)</label>
          <input type="text" id="name-input" placeholder="Anonim" maxlength="20" />
        </div>

        <button id="create-btn" class="btn primary large">
          Xona yaratish + Havola olish
        </button>

        <div class="or-divider"><span>yoki</span></div>

        <div class="input-group">
          <label>Havola yoki Room ID</label>
          <input type="text" id="join-input" placeholder="Havolani joylashtiring yoki ID yozing" />
        </div>
        <button id="join-btn" class="btn secondary">Xonaga kirish</button>
      </div>
    </section>

    <!-- CHAT -->
    <section id="chat-screen" class="screen">
      <header class="topbar">
        <div>
          <div class="room-title" id="room-title">Xona</div>
          <div class="room-count" id="room-count">1 kishi</div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="copy-link-btn" title="Havolani nusxalash">🔗</button>
          <button class="icon-btn" id="leave-btn" title="Chiqish">✕</button>
        </div>
      </header>

      <div class="messages" id="messages"></div>
      <div id="typing" class="typing hidden"></div>

      <div class="composer">
        <label class="img-btn" title="Rasm">
          📷
          <input type="file" id="image-input" accept="image/*" hidden />
        </label>
        <input type="text" id="msg-input" placeholder="Xabar yozing..." maxlength="1000" autocomplete="off" />
        <button id="send-btn" class="btn primary send">➤</button>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
